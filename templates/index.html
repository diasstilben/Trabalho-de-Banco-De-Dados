<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Pacientes</title>
    <!-- Adicionando Bootstrap para deixar o layout profissional rapidinho -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <h2 class="text-center mb-4">🏥 Sistema de Gestão de Pacientes</h2>

    <div class="row">
        <!-- LADO ESQUERDO: Formulário de Cadastro -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Novo Paciente</h5>
                </div>
                <div class="card-body">
                    <!-- O action aponta pra rota do Python e o method é POST -->
                    <form action="/cadastrar/paciente" method="POST">
                        
                       

                        <div class="mb-2">
                            <label>Nome Completo *</label>
                            <input type="text" class="form-control" name="nome" required>
                        </div>

                        <div class="mb-2">
                            <label>CPF *</label>
                            <input type="text" class="form-control" name="CPF" required>
                        </div>

                        <div class="mb-2">
                            <label>Telefone</label>
                            <input type="text" class="form-control" name="telefone">
                        </div>

                        <div class="mb-2">
                            <label>Data de Nascimento</label>
                            <input type="date" class="form-control" name="data_nascimento">
                        </div>

                        <div class="mb-2">
                            <label>Sexo</label>
                            <select class="form-control" name="sexo">
                                <option value="">Selecione...</option>
                                <option value="M">Masculino</option>
                                <option value="F">Feminino</option>
                            </select>
                        </div>

                        <div class="mb-2">
                            <label>Endereço</label>
                            <input type="text" class="form-control" name="endereco">
                        </div>

                        <div class="mb-3">
                            <label>E-mail</label>
                            <input type="email" class="form-control" name="email">
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- LADO DIREITO: Tabela e Pesquisa -->
        <div class="col-md-8">
            
            <!-- Barra de Pesquisa -->
            <form action="/" method="GET" class="d-flex mb-3 shadow-sm">
                <input type="text" class="form-control me-2" name="b_paciente" placeholder="Pesquisar paciente por nome..." value="{{ b_paciente }}">
                <button type="submit" class="btn btn-secondary">Buscar</button>
                <a href="/" class="btn btn-outline-secondary ms-2">Limpar</a>
            </form>

            <!-- Tabela de Dados -->
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>Telefone</th>
                                    <th>Data Nasc.</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- O Jinja2 faz o loop na lista que o Python enviou -->
                                {% for pac in pacientes %}
                                <tr>
                                    <td>{{ pac.nome }}</td>
                                    <td>{{ pac.CPF }}</td>
                                    <td>{{ pac.telefone }}</td>
                                    <td>{{ pac.data_nascimento }}</td>
                                </tr>
                                {% else %}
                                <tr>
                                    <td colspan="5" class="text-center py-3">Nenhum paciente encontrado.</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
