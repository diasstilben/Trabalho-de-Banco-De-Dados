{% extends 'base.html' %}

{% block titulo %}Cadastrar Paciente{% endblock %}

{% block conteudo %}
    <section class="pagina pagina-form">
        <h1>➕ Cadastrar Paciente <span class="badge">INSERT</span></h1>
        <p class="subtitulo">Preencha os campos abaixo. Os itens com * são obrigatórios.</p>

        <!-- Formulário de cadastro: envia os dados via POST para a rota /cadastrar -->
        <form method="post" action="{{ url_for('cadastrar_paciente') }}" id="formCadastro" class="formulario">
            <div class="campos">
                <div class="campo campo-largo">
                    <label for="nome">Nome completo *</label>
                    <input type="text" id="nome" name="nome" required maxlength="100"
                           value="{{ dados.nome if dados else '' }}" placeholder="Ex.: Maria da Silva">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" maxlength="13"
                           value="{{ dados.telefone if dados else '' }}" placeholder="(11) 99999-9999">
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" maxlength="11"
                           value="{{ dados.cpf if dados else '' }}" placeholder="somente números"
                           aria-describedby="cpf-ajuda">
                    <small id="cpf-ajuda" class="ajuda">11 números, sem pontos ou traço.</small>
                </div>

                <div class="campo">
                    <label for="data_nascimento">Data de nascimento</label>
                    <input type="date" id="data_nascimento" name="data_nascimento"
                           value="{{ dados.data_nascimento if dados else '' }}">
                </div>

                <div class="campo">
                    <span class="label-grupo">Sexo</span>
                    <div class="opcoes-radio">
                        <label><input type="radio" name="sexo" value="M"
                            {% if dados and dados.sexo == 'M' %}checked{% endif %}> Masculino</label>
                        <label><input type="radio" name="sexo" value="F"
                            {% if dados and dados.sexo == 'F' %}checked{% endif %}> Feminino</label>
                    </div>
                </div>

                <div class="campo campo-largo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" name="endereco" maxlength="150"
                           value="{{ dados.endereco if dados else '' }}" placeholder="Rua, número, bairro...">
                </div>

                <div class="campo campo-largo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" maxlength="100"
                           value="{{ dados.email if dados else '' }}" placeholder="paciente@email.com">
                </div>
            </div>

            <div class="acoes">
                <button type="submit" class="botao">Salvar paciente</button>
                <a href="{{ url_for('index') }}" class="botao botao-secundario">Cancelar</a>
            </div>
        </form>
    </section>
{% endblock %}
